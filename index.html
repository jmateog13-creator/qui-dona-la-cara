<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Qui dona la cara?</title>
<script>
/* Enllaços directes: ?c=1234 → alumne (Moodle), ?codi=1234 o ?demo → profe */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('c')) location.replace('movil.html' + location.search);
  else if (q.has('codi') || q.has('demo')) location.replace('profe.html' + location.search);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,800..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
:root{--fons:#0f0f10;--placa:#1a1a1d;--linia:#323238;--tinta:#f4f4f2;--suau:#a7a7ad;--fosc:#0f0f10;--pol:#f5d90a;--org:#7b96ff;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;--text:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--fons);color:var(--tinta);font:400 18px/1.5 var(--text);min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background-image:linear-gradient(180deg,#0f0f10cc,#0f0f10f2),url("img/4-pol-carrer.jpg");background-size:cover;background-position:center}
main{width:min(880px,100%);display:flex;flex-direction:column;gap:28px;text-align:center;align-items:center}
.seccio{font:700 14px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--suau)}
h1{margin:0;font:900 clamp(54px,11vw,120px)/.92 var(--display);font-stretch:125%;letter-spacing:-.03em;text-wrap:balance}
h1 span{color:var(--pol)}
.botons{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
@media (max-width:620px){.botons{grid-template-columns:1fr}}
a.boto{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--fosc);border-radius:22px;padding:28px 20px;min-height:170px;
  font:900 clamp(28px,4vw,38px)/1 var(--display);box-shadow:0 8px 0 #0009;transition:transform .08s,box-shadow .08s}
a.boto:active{transform:translateY(5px);box-shadow:0 3px 0 #0009}
a.boto:focus-visible{outline:4px solid var(--tinta);outline-offset:4px}
a.boto .ic{font-size:44px;line-height:1}
a.boto small{font:700 15px var(--text);opacity:.8}
.alumne{background:var(--pol)}
.profe{background:var(--org)}
.nota{color:var(--suau);font-size:15px;max-width:52ch}
</style>
</head>
<body>
<main>
  <span class="seccio">Tutoria · Blocus</span>
  <h1>Qui dona<br><span>la cara?</span></h1>
  <div class="botons">
    <a class="boto alumne" href="movil.html"><span class="ic">📱</span>Sóc alumne/a<small>Entra amb el codi de la pantalla</small></a>
    <a class="boto profe" href="profe.html"><span class="ic">🧑‍🏫</span>Sóc el profe<small>Obre la sala i projecta-la</small></a>
  </div>
  <p class="nota">Anònim: ningú no sabrà què votes. No cal registrar-se.</p>
</main>
</body>
</html>
